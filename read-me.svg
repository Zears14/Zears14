<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 920" width="100%" height="920">
  <defs>
    <!-- Cosmic Void Gradient -->
    <linearGradient id="cosmic-depth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141514" />
      <stop offset="55%" stop-color="#0e0f0e" />
      <stop offset="100%" stop-color="#080908" />
    </linearGradient>

    <!-- Dissipation Gradient for 'forever.' -->
    <linearGradient id="forever-decay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EE99A4" stop-opacity="1.0" />
      <stop offset="60%" stop-color="#EE99A4" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#F3CEB7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#79291F" stop-opacity="0.25" />
    </linearGradient>

    <!-- Radial Nebula Bloom -->
    <radialGradient id="nebula-haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EE99A4" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#79291F" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#141514" stop-opacity="0" />
    </radialGradient>

    <!-- Star Glow Filters -->
    <filter id="glow-candy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#EE99A4" flood-opacity="0.8" result="flood"/>
      <feComposite in="flood" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-sand" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#F3CEB7" flood-opacity="0.6" result="flood"/>
      <feComposite in="flood" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="text-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
    </filter>
  </defs>

  <style>
    /* Typography */
    .cosmic-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      text-transform: lowercase;
      font-weight: 300;
      fill: #F3CEB7;
      font-size: 13px;
      letter-spacing: 0.8px;
    }
    
    .acc-text { fill: #EE99A4; font-weight: 400; }

    .quote-lead {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      text-transform: lowercase;
      font-weight: 200;
      font-size: 14.5px;
      letter-spacing: 4px;
      fill: #F3CEB7;
      opacity: 0.85;
    }

    .quote-mid {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      text-transform: lowercase;
      font-weight: 200;
      font-size: 26px;
      letter-spacing: 2px;
      fill: #F3CEB7;
    }

    .quote-hero {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      text-transform: lowercase;
      font-weight: 300;
      font-size: 44px;
      letter-spacing: 5px;
      fill: url(#forever-decay);
    }

    .quote-bloom {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      text-transform: lowercase;
      font-weight: 300;
      font-size: 44px;
      letter-spacing: 5px;
      fill: #EE99A4;
      opacity: 0.3;
    }

    /* Linework */
    .orbit-line { stroke: #79291F; fill: none; opacity: 0.35; stroke-width: 0.75px; }
    .orbit-dash { stroke: #EE99A4; fill: none; opacity: 0.22; stroke-width: 0.5px; stroke-dasharray: 4 12; }
    .hairline   { stroke: #79291F; fill: none; opacity: 0.5; stroke-width: 0.75px; }

    /* Keyframe Animations */
    @keyframes twinkleFast {
      0%, 100% { opacity: 0.25; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes twinkleSlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.85; }
    }
    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes floatQuote {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes hazePulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.05); }
    }

    .star-f { animation: twinkleFast 3s ease-in-out infinite; transform-origin: center; }
    .star-s { animation: twinkleSlow 5.5s ease-in-out infinite; transform-origin: center; }
    .star-s-d { animation: twinkleSlow 7s ease-in-out infinite 2s; transform-origin: center; }
    
    .rot-cw { animation: spinCW 120s linear infinite; transform-origin: 220px 210px; }
    .rot-ccw { animation: spinCCW 85s linear infinite; transform-origin: 220px 210px; }
    
    .quote-float { animation: floatQuote 6.5s ease-in-out infinite; }
    .haze-anim { animation: hazePulse 7.5s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#cosmic-depth)" />

  <!-- ========================================== -->
  <!-- CELESTIAL ORBITS & ASTRAL NODES            -->
  <!-- ========================================== -->
  <g class="rot-cw">
    <circle cx="220" cy="210" r="190" class="orbit-dash" />
    <circle cx="220" cy="210" r="140" class="orbit-line" stroke-dasharray="2 6" />
    <line x1="25" y1="210" x2="35" y2="210" stroke="#EE99A4" stroke-width="1" opacity="0.4"/>
    <line x1="405" y1="210" x2="415" y2="210" stroke="#EE99A4" stroke-width="1" opacity="0.4"/>
  </g>

  <g class="rot-ccw">
    <circle cx="220" cy="210" r="105" class="orbit-dash" stroke-dasharray="1 8" />
    <circle cx="220" cy="210" r="70" class="orbit-line" />
    <circle cx="220" cy="105" r="2" fill="#EE99A4" filter="url(#glow-candy)" class="star-f"/>
    <circle cx="220" cy="315" r="1.8" fill="#F3CEB7" filter="url(#glow-sand)" class="star-s"/>
  </g>

  <!-- Distributed Twinkling Stars -->
  <circle cx="50" cy="90" r="1.5" fill="#EE99A4" filter="url(#glow-candy)" class="star-s" />
  <circle cx="390" cy="110" r="1.8" fill="#F3CEB7" filter="url(#glow-sand)" class="star-s-d" />
  <circle cx="410" cy="360" r="1.2" fill="#EE99A4" class="star-f" />
  <circle cx="45" cy="420" r="1.2" fill="#F3CEB7" class="star-s" />
  <circle cx="390" cy="620" r="1.5" fill="#EE99A4" filter="url(#glow-candy)" class="star-s-d" />
  <circle cx="60" cy="740" r="1.4" fill="#F3CEB7" filter="url(#glow-sand)" class="star-f" />
  <circle cx="380" cy="850" r="1.2" fill="#EE99A4" class="star-s" />

  <!-- ========================================== -->
  <!-- HERO: THE FLOATING QUOTE                   -->
  <!-- ========================================== -->
  <g transform="translate(220, 210)">
    <ellipse cx="0" cy="6" rx="160" ry="75" fill="url(#nebula-haze)" class="haze-anim" />

    <g class="quote-float">
      <!-- Line 1: Whispered lead-in -->
      <g transform="translate(0, -42)">
        <line x1="-120" y1="-5" x2="-80" y2="-5" class="hairline" />
        <circle cx="-80" cy="-5" r="1.5" fill="#F3CEB7" opacity="0.6" />
        
        <text x="0" y="0" text-anchor="middle" class="quote-lead">remember that you</text>
        
        <circle cx="80" cy="-5" r="1.5" fill="#F3CEB7" opacity="0.6" />
        <line x1="80" y1="-5" x2="120" y2="-5" class="hairline" />
      </g>

      <!-- Line 2: Soft mid clause -->
      <text x="0" y="4" text-anchor="middle" class="quote-mid">don't remember</text>

      <!-- Line 3: Luminous terminal anchor -->
      <g transform="translate(0, 52)">
        <text x="0" y="0" text-anchor="middle" class="quote-bloom" filter="url(#text-bloom)">forever.</text>
        <text x="0" y="0" text-anchor="middle" class="quote-hero">forever.</text>
      </g>

      <!-- Center Axis Notch -->
      <g transform="translate(0, 76)">
        <circle cx="0" cy="0" r="1.5" fill="#79291F" />
        <line x1="-18" y1="0" x2="-5" y2="0" stroke="#79291F" stroke-width="0.75" />
        <line x1="5" y1="0" x2="18" y2="0" stroke="#79291F" stroke-width="0.75" />
      </g>
    </g>
  </g>

  <!-- Horizon Line Separator -->
  <line x1="60" y1="360" x2="380" y2="360" class="orbit-line" opacity="0.5"/>
  <circle cx="220" cy="360" r="2.5" fill="#141514" stroke="#EE99A4" stroke-width="0.8"/>

  <!-- ========================================== -->
  <!-- VERTICAL STACKED INFORMATION SECTIONS      -->
  <!-- ========================================== -->

  <!-- 01: Bio -->
  <g transform="translate(60, 420)">
    <text x="0" y="0" class="cosmic-text acc-text">zears ✦</text>
    <text x="0" y="24" class="cosmic-text">a random dude</text>
    <text x="0" y="46" class="cosmic-text">tinkering with his phone.</text>
  </g>

  <line x1="60" y1="505" x2="380" y2="505" class="orbit-line" opacity="0.25" stroke-dasharray="2 6" />

  <!-- 02: Stack -->
  <g transform="translate(60, 545)">
    <text x="0" y="0" class="cosmic-text acc-text">stack ✦</text>
    <text x="0" y="24" class="cosmic-text">makefile · python · shell</text>
    <text x="0" y="46" class="cosmic-text">c/cc · c# · js</text>
  </g>

  <line x1="60" y1="630" x2="380" y2="630" class="orbit-line" opacity="0.25" stroke-dasharray="2 6" />

  <!-- 03: Targets -->
  <g transform="translate(60, 670)">
    <text x="0" y="0" class="cosmic-text acc-text">targets ✦</text>
    <text x="0" y="24" class="cosmic-text">arm64 hardware</text>
    <text x="0" y="46" class="cosmic-text">aosp kernels · wmk</text>
  </g>

  <line x1="60" y1="755" x2="380" y2="755" class="orbit-line" opacity="0.25" stroke-dasharray="2 6" />

  <!-- 04: Identity / GPG -->
  <g transform="translate(60, 795)">
    <text x="0" y="0" class="cosmic-text acc-text">identity ✦ ed25519</text>
    <text x="0" y="24" class="cosmic-text" font-size="12">73a7 a0aa 0e8c aac9 ff55</text>
    <text x="0" y="45" class="cosmic-text" font-size="12">fd50 e039 31f3 6404 40f5</text>
  </g>

  <!-- Terminal Sigil -->
  <g transform="translate(220, 885)">
    <path d="M -24,0 L -8,0 L 0,-6 L 8,0 L 24,0" class="hairline" opacity="0.4"/>
    <circle cx="0" cy="-6" r="1.5" fill="#EE99A4" filter="url(#glow-candy)"/>
  </g>
</svg>
